name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  # Fast gate (about 3 min): unit/component tests and a production build.
  static:
    name: Lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Lint still has 12 known errors on main (react-hooks / react-refresh rules). Report them without blocking
      # until they are fixed; then delete `continue-on-error` so lint gates like everything else.
      - name: Lint (not blocking yet)
        run: npm run lint
        continue-on-error: true
      - name: Unit and component tests
        run: npm run test:run
      - name: Build
        run: npm run build

  # Browser tests: every spec mocks /api/**, so no backend is needed. Runs only when the fast gate is green.
  e2e:
    name: Playwright (chromium)
    needs: static
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
